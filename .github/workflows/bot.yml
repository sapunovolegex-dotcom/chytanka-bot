name: Chytanka bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chytanka-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot every 5 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: |
          git config user.name "chytanka-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 12); do
            git pull -q --rebase || true
            python bot.py || true
            git add -A
            git diff --cached --quiet || git commit -q -m "bot state"
            git push -q || true
            if [ "$i" -lt 12 ]; then sleep 300; fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }} --ref main
